<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>Assign Role</title>
</head>
<body>
    <main>
        <div class="w-1/2 mx-auto my-10">
            <!-- Display messages -->
            <ul>
                {% for message in messages %}
                    <li class="bg-green-500 text-white px-4 py-2 rounded-md mb-4">{{ message }}</li>
                {% endfor %}
            </ul>

            <!-- Assign Role Form -->
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_role" class="block text-gray-700">Select Role:</label>
                    {{ form.role }}
                </div>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors duration-200">
                    Assign Role
                </button>
            </form>
        </div>
    </main>
</body>
</html>
