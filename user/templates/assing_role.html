<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="w-1/2 mx-auto my-10">
            <ul>
                {% for message in messages %}
                    <li class="bg-green-500 text-white px-1 py-2">{{message}}</li>
                {% endfor %}
            </ul>

            <form method='POST'>
                {% csrf_token %}
                {{form.role}}
                <button type="submit" class="my-5 .px-2  bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors duration-200 view-details-button">Assign Role</button>
            </form>
        </div>
    </main>
</body>
</html>
